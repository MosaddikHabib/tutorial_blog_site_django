<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Post - Admin Dashboard</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center p-5">
                        <i class="fas fa-trash fa-4x text-warning mb-4"></i>
                        <h3 class="mb-3">Move to Trash</h3>
                        <p class="text-muted mb-4">Are you sure you want to move "<strong>{{ post.title }}</strong>" to trash? You can restore it later from the trash bin.</p>
                        
                        <form method="POST">
                            {% csrf_token %}
                            <div class="d-flex gap-2 justify-content-center">
                                <button type="submit" class="btn btn-warning">
                                    <i class="fas fa-trash me-1"></i>Yes, Move to Trash
                                </button>
                                <a href="{% url 'admin_edit_post' post.slug %}" class="btn btn-outline-secondary">
                                    Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
