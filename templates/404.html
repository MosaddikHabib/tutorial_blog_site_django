{% extends 'blog/base.html' %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="text-center">
        <div style="font-size: 150px; font-weight: bold; color: #e5e7eb; margin-bottom: 20px;">
            404
        </div>
        
        <h1 class="display-4 fw-bold mb-3">
            <i class="fas fa-exclamation-triangle" style="color: #ef4444;"></i> Page Not Found
        </h1>
        
        <p class="lead text-muted mb-4">
            Sorry, the page you're looking for doesn't exist or has been moved.
        </p>
        
        <div class="mb-4">
            <img src="https://cdn-icons-png.flaticon.com/512/2748/2748558.png" alt="404 Error" style="max-width: 300px; opacity: 0.7;">
        </div>
        
        <div class="btn-group" role="group">
            <a href="{% url 'post_list' %}" class="btn btn-primary btn-lg">
                <i class="fas fa-home me-2"></i>Go to Home
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-primary btn-lg">
                <i class="fas fa-arrow-left me-2"></i>Go Back
            </a>
        </div>
        
        <div class="mt-5 p-4" style="background: #f3f4f6; border-radius: 10px;">
            <h5 class="mb-3">Quick Links</h5>
            <div class="row">
                <div class="col-md-4">
                    <a href="{% url 'post_list' %}" class="text-decoration-none">
                        <i class="fas fa-newspaper" style="color: #3b82f6;"></i>
                        <p class="small mt-2">Browse Posts</p>
                    </a>
                </div>
                <div class="col-md-4">
                    <a href="{% url 'post_list' %}" class="text-decoration-none">
                        <i class="fas fa-search" style="color: #3b82f6;"></i>
                        <p class="small mt-2">Search</p>
                    </a>
                </div>
                <div class="col-md-4">
                    <a href="{% url 'post_list' %}" class="text-decoration-none">
                        <i class="fas fa-envelope" style="color: #3b82f6;"></i>
                        <p class="small mt-2">Contact Us</p>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
